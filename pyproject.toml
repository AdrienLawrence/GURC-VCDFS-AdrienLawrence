[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
# Both defaults are frozen dataclasses, hence immutable and safe to share.
extend-immutable-calls = ["algs.common.Budget", "Budget", "heuristic.train.TrainingConfig"]

[tool.ruff.lint.per-file-ignores]
# These closures are executed synchronously inside their enclosing loop;
# none escapes to another iteration or another thread.
"tests/test_search_properties.py" = ["B023"]
"heuristic/experiment.py" = ["B023"]
